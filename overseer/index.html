<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ícono de la pestaña / ventana de app. Para cambiarlo: reemplaza
         public/favicon.svg (o pon un favicon.ico/.png y actualiza este href). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OVERSEER · Gym Manager</title>
    <!--
      Fuentes del sistema de diseño "Overseer Modernist":
      - Archivo: títulos y cuerpo (grotesca compacta e industrial; pesos 400–900).
      - Geist Mono: cifras, fechas, horas, precios y códigos.
      Se cargan por <link> (no por npm) para no sumar dependencias al bundle.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
